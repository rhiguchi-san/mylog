<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<!-- 文字コード設定 -->
	<meta charset="UTF-8">
	<!-- ページタイトル -->
	<title>ログカレンダー</title>
	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- FullCalendar CSS -->
	<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
</head>

<!-- メインコンテナ -->
<div class="container mt-5">
	<!-- ページタイトル -->
	<h1 class="mb-4">
		ログカレンダー
	</h1>
	<!-- 表示切替ボタン -->
	<div class="mb-3">
		<!-- ログ一覧画面へ遷移 -->
		<a th:href="@{/logs}" class="btn btn-secondary">
			一覧表示
		</a>
		<!-- ログ登録画面へ遷移 -->
		<a th:href="@{/logs/new}" class="btn btn-success ms-2">
			新規登録
		</a>
	</div>
	<!-- FullCalendarを表示する場所 -->
	<div id="calendar">
	</div>
</div>

<!-- FullCalendar JS -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js">
</script>

<script th:inline="javascript">
	// Spring Bootから受け取ったログ情報
	const logs = [
		/*[# th:each="log : ${logs}"]*/
		{
			id:
				/*[[${log.id}]]*/ '',
			title:
				/*[[${log.genre + '：' + log.content}]]*/ '',
			start:
				/*[[${log.logDate}]]*/ ''
		},
		/*[/]*/
	];

	// HTML読み込み完了後にカレンダーを表示
	document.addEventListener(
		'DOMContentLoaded',
		function () {
			// カレンダー表示エリアを取得
			const calendarEl =
				document.getElementById('calendar');
			// FullCalendarの設定
			const calendar =
				new FullCalendar.Calendar(
					calendarEl,
					{
						// 月表示
						initialView: 'dayGridMonth',
						// 日本語表示
						locale: 'ja',
						// ログデータ
						events: logs,
						// イベントクリック時
						eventClick: function (info) {
							// 編集画面へ移動
							location.href =
								"/logs/"
								+ info.event.id
								+ "/edit?from=calendar";
						},
						// カレンダーへイベントが表示された時の処理
						eventDidMount: function (info) {
							// マウスカーソルをクリック可能な表示に変更
							info.el.style.cursor = "pointer";

						}
					}
				);
			// カレンダーを画面へ表示
			calendar.render();
		}
	);
</script>

</body>

</html>
