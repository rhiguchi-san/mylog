<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<!-- 文字コード・レスポンシブ設定 -->
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- アプリ共通CSS -->
	<link rel="stylesheet" th:href="@{/css/style.css}">

	<!-- ページタイトル -->
	<title>ログ登録</title>

	<!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- アプリ共通CSS -->
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

	<!-- メインコンテナ -->
	<div class="container mt-5">
		<!-- ログ登録カード -->
		<div class="card p-4">
			<!-- 画面タイトル -->
			<h2 class="mb-4">ログ登録</h2>
			<!-- ログ登録フォーム -->
			<form th:action="@{/logs/create}" th:object="${log}" method="post">

				<!-- 非表示項目 -->
				<input type="hidden" th:field="*{id}">
				<input type="hidden" th:field="*{createdAt}">

				<!-- 日付 -->
				<div class="mb-3">

					<label class="form-label">
						日付
					</label>

					<input type="date" class="form-control" th:field="*{logDate}" required>

				</div>

				<!-- ジャンル選択 -->
				<div class="mb-3">
					<label class="form-label">ジャンル</label>

					<select class="form-select" th:field="*{genre}">
						<option value="">選択してください</option>
						<option value="予定">予定</option>
						<option value="学習">学習</option>
						<option value="仕事">仕事</option>
						<option value="日記">日記</option>
						<option value="その他">その他</option>
					</select>

				</div>

				<!-- ログ内容入力 -->
				<div class="mb-3">
					<label class="form-label">ログ</label>

					<textarea class="form-control" th:field="*{content}" rows="8" placeholder="内容を入力してください"></textarea>

				</div>

				<!-- 登録ボタン -->
				<button type="submit" class="btn btn-primary">
					登録
				</button>

				<!-- 一覧画面へ戻る -->
				<a th:href="@{/logs}" class="btn btn-secondary">
					一覧へ
				</a>

			</form>
		</div>
	</div>

</body>

</html>
