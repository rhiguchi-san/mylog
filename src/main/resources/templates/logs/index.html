<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<!-- 文字コード・レスポンシブ設定 -->
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!-- ページタイトル -->
	<title>ログ一覧</title>
	<!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
	<!-- メインコンテナ -->
	<div class="container mt-5">
		<!-- カレンダー画面へ遷移 -->
		<a th:href="@{/logs/calendar}"
		   class="btn btn-primary">
		カレンダー表示
		</a>
		
		<!-- ログ一覧カード -->
		<div class="card p-4">
			<!-- タイトル・新規登録ボタン -->
			<div class="d-flex justify-content-between align-items-center mb-4">
				<!-- 画面タイトル -->
				<h2>ログ一覧</h2>
				<!-- ログ登録画面へ遷移 -->
				<a th:href="@{/logs/new}" class="btn btn-primary">
					新規登録
				</a>
			</div>
			
			<!-- ログ一覧テーブル -->
			<table class="table table-bordered table-hover">
				<!-- テーブルヘッダー -->
				<thead class="table-light">
					<tr>
						<th>日付</th>
						<th>ジャンル</th>
						<th>内容</th>
						<th>登録日時</th>
						<th>更新日時</th>
						<th>操作</th>
					</tr>
				</thead>
				<!-- テーブル本体 -->
				<tbody>
					<!-- ログ一覧を繰り返し表示 -->
					<tr th:each="log : ${logs}">
						<!-- 日付-->
						<td th:text="${#temporals.format(log.logDate,'yyyy/MM/dd')}"></td>
						<!-- ジャンル -->
						<td th:text="${log.genre}"></td>
						<!-- 内容 -->
						<td th:text="${log.content}"></td>
						<!-- 登録日時 -->
						<td th:text="${#temporals.format(log.createdAt,'yyyy/MM/dd HH:mm')}"></td>
						<!-- 更新日時-->
						<td th:text="${#temporals.format(log.updatedAt,'yyyy/MM/dd HH:mm')}"></td>
						<!-- 操作 -->
						<td class="d-flex gap-2">
							<!-- 編集 -->
							<a th:href="@{/logs/{id}/edit(id=${log.id})}" class="btn btn-warning btn-sm">
								編集
							</a>
							<!-- 削除-->
							<form th:action="@{/logs/{id}/delete(id=${log.id})}" method="post">
								<button type="submit" class="btn btn-danger btn-sm"
									onclick="return confirm('このログを削除しますか？');">
									削除
								</button>
							</form>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</body>

</html>
