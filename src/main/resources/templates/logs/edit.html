<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<!-- 文字コード・レスポンシブ設定 -->
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- ページタイトル -->
	<title>ログ編集</title>

	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- CSS -->
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
	<!-- 共通ヘッダー -->
	<div th:replace="~{fragments/header :: header}">
	</div>


	<div class="container mt-5">
		<div class="card p-4">
			<h2 class="mb-4">ログ編集</h2>

			<!-- 更新処理 -->
			<form th:action="@{/logs/{id}/update(id=${log.id})}" th:object="${log}" method="post">
				<!-- 非表示項目 -->
				<input type="hidden" th:field="*{id}">
				<input type="hidden" th:field="*{createdAt}">

				<!-- 日付入力 -->
				<div class="mb-3">
					<!-- 日付ラベル -->
					<label class="form-label">
						日付
					</label>
					<!-- ログの日付を入力 -->
					<input type="date" class="form-control" th:field="*{logDate}">
					<!-- 日付の入力エラーを表示 -->
					<div class="text-danger" th:errors="*{logDate}">
					</div>
				</div>

				<!-- ジャンル選択 -->
				<div class="mb-3">
					<!-- ジャンルラベル -->
					<label class="form-label">
						ジャンル
					</label>
					<!-- ジャンルを選択 -->
					<select class="form-select" th:field="*{genre}">
						<!-- 初期表示用の選択肢 -->
						<option value="">
							選択してください
						</option>
						<!-- ジャンルの選択肢 -->
						<option value="予定">
							予定
						</option>
						<option value="学習">
							学習
						</option>
						<option value="仕事">
							仕事
						</option>
						<option value="日記">
							日記
						</option>
						<option value="その他">
							その他
						</option>
					</select>
					<!-- ジャンルの入力エラーを表示 -->
					<div class="text-danger" th:errors="*{genre}">
					</div>
				</div>

				<!-- ログ内容入力 -->
				<div class="mb-3">
					<!-- 内容ラベル -->
					<label class="form-label">
						ログ
					</label>
					<!-- ログ内容を入力 -->
					<textarea class="form-control" th:field="*{content}" rows="8" placeholder="内容を入力してください">
									</textarea>
					<!-- 内容の入力エラーを表示 -->
					<div class="text-danger" th:errors="*{content}">
					</div>
				</div>

				<!-- ボタン -->
				<div class="d-flex gap-2">
					<button type="submit" class="btn btn-success">
						更新
					</button>
					<a th:if="${from == 'calendar'}" th:href="@{/logs/calendar}" class="btn btn-secondary">
						戻る
					</a>
					<a th:unless="${from == 'calendar'}" th:href="@{/logs}" class="btn btn-secondary">
						戻る
					</a>
				</div>
			</form>

			<!-- 遷移元 -->
			<input type="hidden" name="from" th:value="${from}">

		</div>

	</div>

</body>

</html>
