<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<!-- 文字コード・レスポンシブ設定 -->
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- ページタイトル -->
	<title>ログ編集</title>

	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- CSS -->
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

	<div class="container mt-5">
		<div class="card p-4">
			<h2 class="mb-4">ログ編集</h2>

			<!-- 更新処理 -->
			<form th:action="@{/logs/{id}/update(id=${log.id})}" th:object="${log}" method="post">
				<!-- 非表示項目 -->
				<input type="hidden" th:field="*{id}">
				<input type="hidden" th:field="*{createdAt}">

				<!-- 日付 -->
				<div class="mb-3">
					<label class="form-label">
						日付
					</label>
					<input type="date" class="form-control" th:field="*{logDate}" required>
				</div>

				<!-- ジャンル -->
				<div class="mb-3">
					<label class="form-label">ジャンル</label>

					<select class="form-select" th:field="*{genre}">
						<option value="予定">予定</option>
						<option value="学習">学習</option>
						<option value="仕事">仕事</option>
						<option value="日記">日記</option>
						<option value="その他">その他</option>
					</select>
				</div>

				<!-- 内容 -->
				<div class="mb-3">
					<label class="form-label">ログ</label>

					<textarea class="form-control" th:field="*{content}" rows="8">
					</textarea>
				</div>

				<!-- ボタン -->
				<div class="d-flex gap-2">
					<button type="submit" class="btn btn-success">
						更新
					</button>
					<a th:if="${from == 'calendar'}" th:href="@{/logs/calendar}" class="btn btn-secondary">
						戻る
					</a>
					<a th:unless="${from == 'calendar'}" th:href="@{/logs}" class="btn btn-secondary">
						戻る
					</a>
				</div>
			</form>

			<!-- 遷移元 -->
			<input type="hidden" name="from" th:value="${from}">

		</div>

	</div>

</body>

</html>
